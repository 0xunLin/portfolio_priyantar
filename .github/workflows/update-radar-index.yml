name: Update Radar Index

on:
  push:
    branches: [main, master]
    paths:
      - "radar/posts/**"
      - "scripts/build-radar-index.mjs"

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-radar-index.mjs
      - name: Commit updated index.json
        run: |
          if [ -n "$(git status --porcelain radar/index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add radar/index.json
            git commit -m "chore: update radar index"
            git push
          fi
